name: ci

on:
  push:
  pull_request:

jobs:
  lua-checks:
    name: Lua script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      # The daemon scans scripts/*.pluto at startup and hard-fails on a bad one,
      # so load-check every script (and init.lua) before it can reach a release.
      - name: Load-check scripts
        run: lua5.4 tests/check_scripts.lua

      - name: Unit-test scripts/lib
        run: lua5.4 tests/test_lib.lua
