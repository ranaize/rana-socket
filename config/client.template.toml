[daemon]
socket_type = "unix"
# The daemon runs NATIVELY on the host (see rana-deploy/Makefile). It creates the
# socket under run/rana/ (relative to the rana-deploy dir), which is bind-mounted
# into the agent container at /run/rana so the agent can forward to it. The daemon
# drops to uid 1000 (same as the agent) so the 0o600 socket is connectable.
socket_path = "run/rana/rana-local.sock"
socket_permissions = 0o600

# Each [commands.<key>] maps a command to an executor. The FlatBuffers union
# table is derived from the key (CamelCase + "Cmd", e.g. "volume" -> "VolumeCmd",
# "mc_server" -> "McServerCmd"); "browser" is the one exception -> "LaunchBrowserCmd".
# You never specify 'variant' in the toml.

[commands.volume]
type = "script"
path = "rana-volume.sh"
# Params are injected as env vars from the strongly-typed fields:
# LEVEL, MUTE
timeout_ms = 2000
description = "set the speaker volume or mute the sound"
keywords = ["volume", "sound", "mute"]

[commands.media]
type = "script"
path = "rana-media.sh"
# ACTION, TARGET
timeout_ms = 2000
description = "play, pause, or stop media on a player"
keywords = ["media", "play", "pause", "kodi", "mpv"]

[commands.browser]
type = "exec"
binary = "/usr/bin/xdg-open"
default_url = "https://duckduckgo.com"
description = "open the default web browser"
keywords = ["browser", "open browser"]

[commands.speak]
type = "exec"
binary = "/usr/bin/espeak-ng"
timeout_ms = 5000
description = "general knowledge, trivia, definitions, math, and facts"
keywords = ["question", "what", "who", "how"]

[commands.lights]
type = "script"
path = "rana-lights.sh"
# ACTION, ROOM
timeout_ms = 2000
description = "toggle the smart lights"
keywords = ["lights", "light", "lamp"]

# No [commands.ask] here: the notebook daemon is a forwarder. AskCmd rides over
# the socket to the server-side rana-socketd, which is the ONLY LocalAI caller
# (see server.toml). The client only needs the local device commands above.
