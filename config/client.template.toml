[daemon]
socket_type = "unix"
# Shared with the rana-voice-agent container over the `rana_sock` volume
# (mounted at /run/rana in both). The daemon runs as uid 1000 (same as the
# agent) so the 0o600 socket is connectable by the agent.
socket_path = "/run/rana/rana-local.sock"
socket_permissions = 0o600

# Each command maps a union variant name to an executor.
# The union variant name MUST match the FlatBuffers table name.

[commands.volume]
variant = "VolumeCmd"
type = "script"
path = "/usr/local/bin/rana-volume.sh"
# Params are injected as env vars from the strongly-typed fields:
# LEVEL, MUTE
timeout_ms = 2000

[commands.media]
variant = "MediaCmd"
type = "script"
path = "/usr/local/bin/rana-media.sh"
# ACTION, TARGET
timeout_ms = 2000

[commands.browser]
variant = "LaunchBrowserCmd"
type = "exec"
binary = "/usr/bin/xdg-open"
default_url = "https://duckduckgo.com"

[commands.speak]
variant = "SpeakCmd"
type = "exec"
binary = "/usr/bin/espeak-ng"
timeout_ms = 5000

[commands.lights]
variant = "LightCmd"
type = "script"
path = "/usr/local/bin/rana-lights.sh"
# ACTION, ROOM
timeout_ms = 2000

# No [commands.ask] here: the notebook daemon is a forwarder. AskCmd rides over
# the socket to the server-side rana-socketd, which is the ONLY LocalAI caller
# (see server.toml). The client only needs the local device commands above.
