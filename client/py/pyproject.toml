[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rana-socket-client"
version = "0.1.0"
description = "Type-safe FlatBuffers clients for the rana-socketd daemon"
requires-python = ">=3.11"
dependencies = [
    "flatbuffers>=24.3",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py311"