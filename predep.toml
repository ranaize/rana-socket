main = "build"
project = "rana-socketd"

[[vendor]]
name = "tomlplusplus"
url = "https://raw.githubusercontent.com/marzer/tomlplusplus/v3.4.0/toml.hpp"
sha256 = "6b5172ad4dd6519aec67b919181fa7a38a2234131e5b2afa232dfe444819783e"
dest = "root://vendor/"
create_directory = true

[[stages]]
name = "vendor"
type = "vendor"

[[stages]]
name = "build"
type = "premake5"
depends = ["vendor"]
clean = true
outputs = [
  "root://socket/bin/Release/rana-socketd",
  "root://serializer/bin/Release/rana-serializer",
]

[[stages]]
name = "clean"
type = "clean"
targets = ["build"]
paths = [
  "root://socket/bin",
  "root://socket/obj",
  "root://serializer/bin",
  "root://serializer/obj",
  "root://serializer/lib",
  "root://client/cpp/bin",
  "root://client/cpp/obj",
]

# Install the daemon runtime onto the host. predep auto-sudo's when the prefix
# needs elevation and (with chown_user) hands file ownership to the invoking user
# so re-installs don't require root. This is what `make socket` in rana-deploy
# invokes; the daemon configs already point at /usr/local/bin/*.
[install]
depends = ["build"]
dir = "/usr/local/bin"
chmod = 755
chown_user = true
artifacts = [
  { source = "root://socket/bin/Release/rana-socketd", dest = "rana-socketd" },
]
